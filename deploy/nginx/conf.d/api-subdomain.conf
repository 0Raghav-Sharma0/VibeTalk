# Optional: API on api.nexaura.example.com (frontend on main domain)
# Use when VITE_BACKEND_URL=https://api.nexaura.example.com

server {
    listen 80;
    listen [::]:80;
    server_name api.nexaura.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nexaura.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.nexaura.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nexaura.example.com/privkey.pem;
    include /etc/nginx/snippets/nexaura/ssl-params.conf;

    client_max_body_size 55m;
    include /etc/nginx/snippets/nexaura/proxy-headers.conf;

    location /socket.io/ {
        proxy_pass http://nexaura_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        limit_req zone=nexaura_api burst=60 nodelay;
        proxy_pass http://nexaura_api;
        proxy_read_timeout 120s;
    }
}
