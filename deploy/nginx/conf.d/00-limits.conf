# Shared rate limit zones (loaded before site configs)
limit_req_zone $binary_remote_addr zone=vibetalk_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vibetalk_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vibetalk_conn:20m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
