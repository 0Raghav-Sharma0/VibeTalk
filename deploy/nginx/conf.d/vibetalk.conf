# VibeTalk production site — reverse proxy + static SPA
#
# Install:
#   sudo cp deploy/nginx/conf.d/*.conf /etc/nginx/conf.d/
#   sudo cp -r deploy/nginx/snippets /etc/nginx/snippets/vibetalk/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set your domain below before enabling HTTPS

# Rate limits: deploy/nginx/conf.d/00-limits.conf

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name vibetalk.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (main) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibetalk.example.com;

    # Let's Encrypt (certbot certonly --nginx -d vibetalk.example.com)
    ssl_certificate     /etc/letsencrypt/live/vibetalk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibetalk.example.com/privkey.pem;
    include /etc/nginx/snippets/vibetalk/ssl-params.conf;

    # Frontend build: cd frontend && npm run build
    root /var/www/vibetalk/frontend/dist;
    index index.html;

    client_max_body_size 55m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security (API also uses helmet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/vibetalk/proxy-headers.conf;

    # --- Socket.IO (WebSocket + long-polling) ---
    location /socket.io/ {
        limit_conn vibetalk_conn 50;

        proxy_pass http://vibetalk_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # --- REST API ---
    location /api/ {
        limit_req zone=vibetalk_api burst=60 nodelay;

        proxy_pass http://vibetalk_api;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Stricter limit on auth endpoints
    location /api/auth/ {
        limit_req zone=vibetalk_auth burst=10 nodelay;
        proxy_pass http://vibetalk_api;
    }

    # --- Health (public minimal; lock down metrics in production) ---
    location = /health {
        proxy_pass http://vibetalk_api;
        access_log off;
    }

    location = /ready {
        proxy_pass http://vibetalk_api;
        access_log off;
    }

    # Prometheus — restrict to VPC / localhost (uncomment allow rules)
    location /metrics/prometheus {
        # allow 10.0.0.0/8;
        # allow 127.0.0.1;
        # deny all;
        proxy_pass http://vibetalk_api;
        access_log off;
    }

    location /metrics {
        # allow 10.0.0.0/8;
        # allow 127.0.0.1;
        # deny all;
        proxy_pass http://vibetalk_api;
        access_log off;
    }

    # Optional: backend static songs
    location /songs/ {
        proxy_pass http://vibetalk_api;
        proxy_cache_valid 200 1h;
    }

    # --- SPA (React) — must be last ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
