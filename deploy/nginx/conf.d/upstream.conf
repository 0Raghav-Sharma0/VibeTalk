# NexAura API upstream — sticky sessions for Socket.IO (ip_hash).
# Scale: run multiple API processes/ports or Docker replicas behind this block.
#
# Docker Compose (service name `api`, internal port 5001):
#   server api:5001 max_fails=3 fail_timeout=30s;
#
# Multi-process on one host:
#   server 127.0.0.1:5001;
#   server 127.0.0.1:5002;
#   server 127.0.0.1:5003;
#   server 127.0.0.1:5004;

upstream nexaura_api {
    ip_hash;
    # Bare metal / PM2 on host:
    server 127.0.0.1:5001 max_fails=3 fail_timeout=30s;
    # Docker Compose — comment line above, uncomment below:
    # server api:5001 max_fails=3 fail_timeout=30s;
    keepalive 64;
}
