# Production-style local stack (API + worker split)
# Usage: cp backend/.env.example backend/.env && docker compose -f docker-compose.prod.yml up --build

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      target: api
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      RUN_WORKERS_IN_API: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: ./backend
      target: worker
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_ONLY: "true"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  redis_data:
